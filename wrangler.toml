name = "ildonodiatena"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Database D1 per prenotazioni e disponibilità.
# Crea il DB con:  wrangler d1 create ildonodiatena-db
# e incolla qui il database_id restituito.
[[d1_databases]]
binding = "DB"
database_name = "ildonodiatena-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# I secret (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) NON vanno qui.
# In produzione:  wrangler pages secret put STRIPE_SECRET_KEY
# In locale:      file .dev.vars (vedi .dev.vars.example)
